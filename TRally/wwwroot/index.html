<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRally - 토론으로 성장하는 우리</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 로그인 페이지 -->
        <div id="loginPage" class="auth-page">
            <div class="logo">TRally</div>
            <p class="subtitle">토론으로 성장하는 우리</p>

            <!-- 로그인 폼 -->
            <div id="loginFormContainer">
                <form class="auth-form" onsubmit="login(event)">
                    <div class="input-group">
                        <label>아이디</label>
                        <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label>비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <button type="submit" class="auth-btn">로그인</button>
                </form>

                <p class="switch-form">
                    계정이 없으신가요? <a onclick="showSignup()">회원가입</a>
                </p>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signupFormContainer" class="hidden">
                <form class="auth-form" onsubmit="signup(event)">
                    <div class="input-group">
                        <label>이름</label>
                        <input type="text" id="signupName" placeholder="실명을 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label>아이디</label>
                        <input type="text" id="signupUsername" placeholder="사용할 아이디를 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label>비밀번호</label>
                        <input type="password" id="signupPassword" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label>비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                    </div>
                    <div class="input-group">
                        <label>이메일</label>
                        <input type="email" id="signupEmail" placeholder="example@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>소개</label>
                        <textarea id="signupIntro" placeholder="간단한 자기소개를 작성해주세요" required></textarea>
                    </div>
                    <button type="submit" class="auth-btn">가입 신청</button>
                </form>

                <p class="switch-form">
                    이미 계정이 있으신가요? <a onclick="showLogin()">로그인</a>
                </p>
            </div>
        </div>

        <!-- 메인 페이지 -->
        <div id="mainPage" class="main-page">
            <div class="header">
                <h1>TRally</h1>
                <div class="user-info">
                    <span id="currentUser">사용자</span>
                    <button class="logout-btn" onclick="logout()">로그아웃</button>
                </div>
            </div>

            <div class="content">
                <div class="sidebar">
                    <div class="menu-item active" onclick="showPage('schedule')">
                        📅 일정
                    </div>
                    <div class="menu-item" onclick="showPage('topics')">
                        📝 주제 목록
                    </div>
                    <div class="menu-item" onclick="showPage('attendance')">
                        📋 출석부
                    </div>
                    <div class="menu-item" onclick="showPage('gallery')">
                        🖼️ 갤러리
                    </div>
                    <div class="menu-item" onclick="showPage('requests')">
                        📨 요청사항
                    </div>
                    <div id="adminMenu" class="menu-item hidden" onclick="showPage('admin')">
                        👑 회원 승인
                    </div>
                </div>

                <div class="main-content">
                    <!-- 일정 페이지 -->
                    <div id="schedulePage" class="content-page">
                        <h2 class="page-title">토론 일정</h2>

                        <!-- 일정 추가 폼 -->
                        <div id="scheduleFormContainer" class="hidden">
                            <form class="schedule-form" onsubmit="saveSchedule(event)">
                                <input type="hidden" id="scheduleEditId">
                                <div class="form-row">
                                    <div class="form-col form-col-small">
                                        <label>회차</label>
                                        <input type="number" id="scheduleNumber" placeholder="205" required>
                                    </div>
                                    <div class="form-col">
                                        <label>발제자</label>
                                        <input type="text" id="schedulePresenter" placeholder="발제자">
                                    </div>
                                    <div class="form-col">
                                        <label>사회자</label>
                                        <input type="text" id="scheduleModerator" placeholder="사회자">
                                    </div>
                                    <div class="form-col">
                                        <label>날짜</label>
                                        <input type="date" id="scheduleDate">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col">
                                        <label>주제</label>
                                        <input type="text" id="scheduleTopic" placeholder="토론 주제">
                                    </div>
                                    <div class="form-col">
                                        <label>장소</label>
                                        <input type="text" id="scheduleLocation" placeholder="장소">
                                    </div>
                                    <div class="form-col">
                                        <label>게스트</label>
                                        <input type="text" id="scheduleGuest" placeholder="게스트">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>비고</label>
                                        <textarea id="scheduleRemarks" placeholder="비고" rows="2"></textarea>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>요약 파일 (PDF 등)</label>
                                        <div class="file-input-wrapper">
                                            <input type="file" id="scheduleFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt" multiple>
                                            <div id="scheduleFileList" class="file-list"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="save-btn">저장</button>
                                    <button type="button" class="cancel-btn" onclick="cancelScheduleEdit()">취소</button>
                                </div>
                            </form>
                        </div>

                        <!-- 일정 버튼들 -->
                        <div class="schedule-buttons hidden" id="scheduleButtons">
                            <button class="add-btn" onclick="showScheduleForm()">+ 새 일정 추가</button>
                            <label class="upload-btn hidden" id="excelUploadBtn">
                                📁 엑셀 업로드
                                <input type="file" id="excelUpload" accept=".xlsx,.xls" onchange="uploadExcel(event)" hidden>
                            </label>
                        </div>

                        <!-- 일정 표 -->
                        <div class="table-wrapper">
                            <div class="table-scroll-top" id="scrollTop">
                                <div class="table-scroll-top-inner" id="scrollTopInner"></div>
                            </div>
                            <div class="table-container" id="tableContainer">
                                <table class="schedule-table" id="scheduleTable">
                                    <thead>
                                        <tr>
                                            <th>회차</th>
                                            <th>댓글</th>
                                            <th class="presenter-col">발제자</th>
                                            <th>사회자</th>
                                            <th>날짜</th>
                                            <th>주제</th>
                                            <th>요약</th>
                                            <th>장소</th>
                                            <th>게스트</th>
                                            <th>비고</th>
                                            <th id="scheduleActionsHeader" class="hidden">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody id="scheduleTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 주제 목록 페이지 -->
                    <div id="topicsPage" class="content-page hidden">
                        <h2 class="page-title">제안된 주제</h2>

                        <!-- 주제 추가/수정 폼 -->
                        <div id="topicFormContainer" class="hidden">
                            <form class="schedule-form" onsubmit="saveTopic(event)">
                                <input type="hidden" id="topicEditId">
                                <div class="form-row">
                                    <div class="form-col">
                                        <label>제안자</label>
                                        <input type="text" id="topicAuthor" placeholder="이름" required>
                                    </div>
                                    <div class="form-col">
                                        <label>진행 날짜</label>
                                        <input type="date" id="topicDate">
                                    </div>
                                    <div class="form-col form-col-small">
                                        <label>진행 여부</label>
                                        <select id="topicCompleted">
                                            <option value="false">미진행</option>
                                            <option value="true">진행됨</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>주제</label>
                                        <input type="text" id="topicTitle" placeholder="토론 주제" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>주제 분야</label>
                                        <input type="hidden" id="topicCategory">
                                        <div class="topic-cat-pick-group" id="topicCategorySelect">
                                            <button type="button" class="topic-cat-pick" data-cat="기술/미래" onclick="selectTopicCategory('기술/미래')">⚙️ 기술/미래</button>
                                            <button type="button" class="topic-cat-pick" data-cat="사회/문화" onclick="selectTopicCategory('사회/문화')">🌍 사회/문화</button>
                                            <button type="button" class="topic-cat-pick" data-cat="관계/소통" onclick="selectTopicCategory('관계/소통')">💬 관계/소통</button>
                                            <button type="button" class="topic-cat-pick" data-cat="심리/인식" onclick="selectTopicCategory('심리/인식')">🧠 심리/인식</button>
                                            <button type="button" class="topic-cat-pick" data-cat="철학/가치관" onclick="selectTopicCategory('철학/가치관')">💡 철학/가치관</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row hidden" id="topicCustomKwRow">
                                    <div class="form-col form-col-full">
                                        <label>추가 키워드 <span class="admin-label">관리자</span></label>
                                        <input type="text" id="topicKeywords" placeholder="예: AI, 포스트모던, 창의성">
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="save-btn">저장</button>
                                    <button type="button" class="cancel-btn" onclick="cancelTopicEdit()">취소</button>
                                    <button type="button" class="delete-btn" id="topicDeleteBtn" onclick="deleteCurrentTopic()" style="display:none;">삭제</button>
                                </div>
                            </form>
                        </div>

                        <!-- 주제 추가 버튼 -->
                        <div class="schedule-buttons hidden" id="topicButtons">
                            <button class="add-btn" onclick="showTopicForm()">+ 새 주제 추가</button>
                        </div>

                        <div class="topic-filter-panel">
                            <div class="filter-group">
                                <span class="filter-group-label">진행 여부</span>
                                <div class="filter-pills">
                                    <button class="filter-pill status-pill active" id="statusAll" onclick="setStatusFilter('all')">전체</button>
                                    <button class="filter-pill status-pill" id="statusPending" onclick="setStatusFilter('pending')">미진행</button>
                                    <button class="filter-pill status-pill" id="statusCompleted" onclick="setStatusFilter('completed')">진행됨</button>
                                </div>
                            </div>
                            <div class="filter-group">
                                <span class="filter-group-label">제안자</span>
                                <div class="filter-pills" id="authorFilterPills">
                                    <button class="filter-pill author-pill" data-author="다흰" onclick="toggleAuthorFilter('다흰')">다흰</button>
                                    <button class="filter-pill author-pill" data-author="민구" onclick="toggleAuthorFilter('민구')">민구</button>
                                    <button class="filter-pill author-pill" data-author="아름" onclick="toggleAuthorFilter('아름')">아름</button>
                                    <button class="filter-pill author-pill" data-author="승종" onclick="toggleAuthorFilter('승종')">승종</button>
                                    <button class="filter-pill author-pill" data-author="원혁" onclick="toggleAuthorFilter('원혁')">원혁</button>
                                    <button class="filter-pill author-pill" data-author="동원" onclick="toggleAuthorFilter('동원')">동원</button>
                                    <button class="filter-pill author-pill" data-author="샘" onclick="toggleAuthorFilter('샘')">샘</button>
                                    <button class="filter-pill author-pill" data-author="유정" onclick="toggleAuthorFilter('유정')">유정</button>
                                    <button class="filter-pill author-pill" data-author="강석" onclick="toggleAuthorFilter('강석')">강석</button>
                                </div>
                            </div>
                            <div class="filter-group">
                                <span class="filter-group-label">주제 분야</span>
                                <div class="filter-pills" id="categoryFilterPills">
                                    <button class="filter-pill category-pill" data-category="기술/미래" onclick="toggleCategoryFilter('기술/미래')">⚙️ 기술/미래</button>
                                    <button class="filter-pill category-pill" data-category="사회/문화" onclick="toggleCategoryFilter('사회/문화')">🌍 사회/문화</button>
                                    <button class="filter-pill category-pill" data-category="관계/소통" onclick="toggleCategoryFilter('관계/소통')">💬 관계/소통</button>
                                    <button class="filter-pill category-pill" data-category="심리/인식" onclick="toggleCategoryFilter('심리/인식')">🧠 심리/인식</button>
                                    <button class="filter-pill category-pill" data-category="철학/가치관" onclick="toggleCategoryFilter('철학/가치관')">💡 철학/가치관</button>
                                </div>
                            </div>
                            <div class="filter-footer">
                                <button class="filter-reset-btn" onclick="resetTopicFilters()">필터 초기화</button>
                                <span class="filter-count" id="topicFilterCount"></span>
                            </div>
                        </div>
                        <div class="topic-content" id="topicContent"></div>
                    </div>

                    <!-- 출석부 페이지 -->
                    <div id="attendancePage" class="content-page hidden">
                        <h2 class="page-title">출석부</h2>

                        <!-- 연도 탭 -->
                        <div class="attendance-tabs">
                            <div class="year-tabs" id="yearTabs"></div>
                            <button class="add-year-btn hidden" id="addYearBtn" onclick="showAddYearModal()">+ 연도 추가</button>
                        </div>

                        <!-- 관리 버튼 -->
                        <div class="attendance-actions hidden" id="attendanceActions">
                            <button class="add-btn" onclick="showAddMemberModal()">+ 멤버 추가</button>
                            <button class="add-btn" onclick="showAddScheduleModal()">+ 일정 추가</button>
                        </div>

                        <!-- 출석부 테이블 -->
                        <div class="attendance-table-wrapper">
                            <div class="attendance-table-container" id="attendanceTableContainer">
                                <table class="attendance-table" id="attendanceTable">
                                    <thead id="attendanceTableHead"></thead>
                                    <tbody id="attendanceTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 멤버 추가 모달 -->
                    <div id="addMemberModal" class="modal hidden">
                        <div class="modal-content">
                            <h3>멤버 추가</h3>
                            <div class="form-col">
                                <label>멤버 이름</label>
                                <input type="text" id="newMemberName" placeholder="이름을 입력하세요">
                            </div>
                            <div class="modal-actions">
                                <button class="save-btn" onclick="addMember()">추가</button>
                                <button class="cancel-btn" onclick="closeModal('addMemberModal')">취소</button>
                            </div>
                        </div>
                    </div>

                    <!-- 일정 추가 모달 -->
                    <div id="addScheduleModal" class="modal hidden">
                        <div class="modal-content">
                            <h3>일정 추가</h3>
                            <div class="form-col">
                                <label>일정 날짜 (예: 1/11)</label>
                                <input type="text" id="newScheduleDate" placeholder="월/일 형식으로 입력">
                            </div>
                            <div class="modal-actions">
                                <button class="save-btn" onclick="addAttendanceSchedule()">추가</button>
                                <button class="cancel-btn" onclick="closeModal('addScheduleModal')">취소</button>
                            </div>
                        </div>
                    </div>

                    <!-- 연도 추가 모달 -->
                    <div id="addYearModal" class="modal hidden">
                        <div class="modal-content">
                            <h3>연도 추가</h3>
                            <div class="form-col">
                                <label>연도</label>
                                <input type="number" id="newYear" placeholder="예: 2027" min="2020" max="2100">
                            </div>
                            <div class="modal-actions">
                                <button class="save-btn" onclick="addYear()">추가</button>
                                <button class="cancel-btn" onclick="closeModal('addYearModal')">취소</button>
                            </div>
                        </div>
                    </div>

                    <!-- 갤러리 페이지 -->
                    <div id="galleryPage" class="content-page hidden">
                        <h2 class="page-title">갤러리</h2>

                        <!-- 사진 추가 버튼 -->
                        <div class="schedule-buttons hidden" id="galleryButtons">
                            <button class="add-btn" onclick="showGalleryForm()">+ 사진 추가</button>
                        </div>

                        <!-- 사진 추가 폼 -->
                        <div id="galleryFormContainer" class="hidden">
                            <form class="schedule-form" onsubmit="saveGalleryItem(event)">
                                <input type="hidden" id="galleryEditId">
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>제목</label>
                                        <input type="text" id="galleryTitle" placeholder="사진 제목" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-col form-col-full">
                                        <label>설명 (선택)</label>
                                        <textarea id="galleryDescription" placeholder="사진에 대한 설명" rows="2"></textarea>
                                    </div>
                                </div>
                                <div class="form-row" id="galleryImageInputRow">
                                    <div class="form-col form-col-full">
                                        <label>사진 선택</label>
                                        <input type="file" id="galleryImage" accept="image/*" onchange="previewGalleryImage(event)">
                                        <div id="galleryImagePreview" class="gallery-image-preview hidden">
                                            <img id="galleryPreviewImg" src="" alt="미리보기">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="save-btn">저장</button>
                                    <button type="button" class="cancel-btn" onclick="cancelGalleryEdit()">취소</button>
                                </div>
                            </form>
                        </div>

                        <!-- 갤러리 그리드 -->
                        <div class="gallery-grid" id="galleryGrid"></div>
                    </div>

                    <!-- 이미지 모달 -->
                    <div id="imageModal" class="modal hidden">
                        <div class="image-modal-content">
                            <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
                            <img id="modalImage" src="" alt="">
                            <div class="image-modal-info">
                                <h3 id="modalTitle"></h3>
                                <p id="modalDescription"></p>
                                <p class="modal-meta">
                                    <span id="modalUploader"></span> · <span id="modalDate"></span>
                                </p>
                                <div class="modal-actions hidden" id="modalActions">
                                    <button class="edit-btn" id="modalEditBtn" onclick="editGalleryFromModal()">수정</button>
                                    <button class="delete-btn" onclick="deleteGalleryFromModal()">삭제</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 요청사항 페이지 -->
                    <div id="requestsPage" class="content-page hidden">
                        <h2 class="page-title">요청사항</h2>

                        <!-- 요청 추가 버튼 -->
                        <div class="schedule-buttons" id="requestButtons">
                            <button class="add-btn" onclick="showRequestForm()">+ 요청 추가</button>
                        </div>

                        <!-- 요청 추가 폼 -->
                        <div id="requestFormContainer" class="hidden">
                            <form class="schedule-form" onsubmit="addRequest(event)">
                                <div class="form-row">
                                    <div class="form-col req-name-input-col">
                                        <label>이름</label>
                                        <input type="text" id="requestName" placeholder="이름 입력" required>
                                    </div>
                                    <div class="form-col form-col-full">
                                        <label>요청사항</label>
                                        <textarea id="requestContent" placeholder="요청사항을 입력하세요" rows="3" required></textarea>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="save-btn">등록</button>
                                    <button type="button" class="cancel-btn" onclick="cancelRequestForm()">취소</button>
                                </div>
                            </form>
                        </div>

                        <!-- 요청 테이블 -->
                        <div class="requests-table-wrapper" id="requestsTableWrapper">
                            <table class="requests-table" id="requestsTable">
                                <thead>
                                    <tr>
                                        <th class="req-name-col">이름</th>
                                        <th class="req-content-col">요청사항</th>
                                        <th class="req-status-col">조치반영</th>
                                        <th class="req-action-col hidden" id="requestsActionHeader">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="requestsTableBody"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 관리자 페이지 -->
                    <div id="adminPage" class="content-page hidden">
                        <h2 class="page-title">회원 관리</h2>

                        <!-- 승인 대기 섹션 -->
